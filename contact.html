<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sun Automations" />
  <title>Contact Us | Sun Automations</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="#home" aria-label="Sun Automations home">
        <span class="brand-item">
          <span class="logo" aria-hidden="true"><img src="./Assets/Logo.jpeg" alt="Logo icon" /></span>
          <span>Sun Automations</span>
        </span>
      </a>

      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./about.html">About Us</a>
        <a href="./projects.html">Projects &amp; Services</a>
        <a class="active" href="./contact.html">Contact Us</a>
      </nav>
    </div>
  </header>
    <main>
        <section class="contact-page">

            <div class="container">

                <div class="contact-heading">

                    <h1>Contact Us</h1>

                    <p>
                       Tell us about your product or machine requirements
    and our team will get back to you.
                    </p>

                </div>


                <!-- CONTACT FORM -->

                <form class="contact-form"
                      action="./send-email.php"
                      method="POST">

                    <!-- NAME -->
                    <div class="form-group">

                        <label for="name">
                            Full Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- COMPANY -->
                    <div class="form-group">

                        <label for="company">
                            Company Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="company"
                            name="company"
                            placeholder="Enter your company name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PHONE -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- SERVICE -->
                    <div class="form-group">

                        <label for="service">
                            Service Required <span class="required">*</span>
                        </label>

                        <select id="service" name="service" required>

    <option value="">Select a service / product</option>

    <optgroup label="Belt Conveyor Parts">
        <option value="Steel Tube Conveyor Rollers">
            Steel Tube Conveyor Rollers
        </option>

        <option value="Drive Pulley for Belt Conveyor">
            Drive Pulley for Belt Conveyor
        </option>

        <option value="Tail Pulley for Belt Conveyor">
            Tail Pulley for Belt Conveyor
        </option>

        <option value="Guide Rollers">
            Guide Rollers
        </option>

        <option value="Impact Rollers">
            Impact Rollers
        </option>

        <option value="Idler Roller Frames">
            Idler Roller Frames
        </option>

        <option value="Return Rollers">
            Return Rollers
        </option>

        <option value="Return Roller Mounting Brackets">
            Return Roller Mounting Brackets
        </option>

        <option value="Belt Adjustment Attachment">
            Belt Adjustment Attachment
        </option>
    </optgroup>


    <optgroup label="Industrial Spare Parts">
        <option value="Sugar Mill Spare Parts">
            Sugar Mill Spare Parts
        </option>

        <option value="Paper Mill Spare Parts">
            Paper Mill Spare Parts
        </option>

        <option value="Cement Plant Spare Parts">
            Cement Plant Spare Parts
        </option>
    </optgroup>


    <optgroup label="Machines">
        <option value="Concrete Block Machine">
            Concrete Block Machines
        </option>

        <option value="Paver Block Machine">
            Paver Block Machines
        </option>

        <option value="Interlock Block Machine">
            Interlock Block Machines
        </option>

        <option value="Multicolour Paver Block Machine">
            Multicolour Paver Block Machines
        </option>

        <option value="Hydraulic Deep Drawing Press">
            Hydraulic Deep Drawing Press
        </option>

        <option value="Profile Bending Machine">
            Profile Bending Machines
        </option>
    </optgroup>

</select>

                    </div>


                    <!-- PROJECT DETAILS -->
                    <div class="form-group">

                        <label for="message">
                            Project Details <span class="required">*</span>
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Please describe your project or automation requirements..."
                            required
                        ></textarea>

                    </div>


                    <!-- SUBMIT -->
                    <button type="submit">
                        Send Enquiry
                    </button>

                </form>

            </div>

        </section>
  </main>
  <footer>
  <section id="home" class="footer">
    <div class="footer-overlay"></div>
  <div class="footer-section footer-brand">
    <img src="./Assets/Logo.jpeg" alt="Sun Automations Logo" class="footer-logo" />
  </div>
  <div class="footer-section">
    <h3 class="eyebrow light"><span style='font-size:40px;'>&#128506;</span> Location</h3>
    <p class="eyebrow light"> <a href="https://maps.app.goo.gl/ydB1p9qRb4KfrKTp9?g_st=aw" target="_blank" rel="Company Location">View on Google Maps</a></p>
  </div>

  <div class="footer-section">
    <h3 class="eyebrow light"><span style='font-size:35px;'> ✉</span>Contact </h3>
    <p class="eyebrow light">
  <a href="https://mail.google.com/mail/?view=cm&fs=1&to=sunautomats@gmail.com"
     target="_blank">Email Us </a>
</p>
  </div>

  </section><p class="eyebrow">©Sun Automations: All rights reserved</p>
</footer>
<script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => nav.classList.remove('open')));
  </script>
</body>
</html>
